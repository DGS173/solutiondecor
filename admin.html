<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration – DEOGRATIAS SOLUTION DÉCOR</title>
<style>
:root{--nuit:#14305a;--orange:#e8821a;--fond:#f6f7f9;--texte:#1c2433;--gris:#6b7486}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte)}
header{background:var(--nuit);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.15rem}
header a{color:#d5def0;font-size:.9rem}
main{max-width:640px;margin:auto;padding:16px}
input,textarea,button{font:inherit}
input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:12px;border:1px solid #d5dae3;border-radius:10px;background:#fff}
input[type=color]{width:100%;height:46px;border:1px solid #d5dae3;border-radius:10px;background:#fff;padding:3px}
label{display:block;font-weight:700;margin:14px 0 6px}
button{border:0;border-radius:10px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff}
button.neutre{background:#e3e7ee;color:var(--texte)}
button.danger{background:#b3261e}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--nuit);outline-offset:2px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{flex:1;background:#e3e7ee;color:var(--texte)}
nav button.on{background:var(--nuit);color:#fff}
.ligne{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:10px;margin-top:10px}
.ligne img{width:64px;height:64px;object-fit:contain;background:#eef1f6;border-radius:8px;flex:none}
.ligne div{flex:1;min-width:0}
.ligne b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne small{color:var(--gris)}
.fiche{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:14px;margin-top:12px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions button{flex:1}
#msg{font-weight:600;line-height:1.4;margin-top:14px}
.ok{color:#1f7a45}.ko{color:#b3261e}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Administration de la boutique</h1><a href="index.html">Voir le site</a></header>
<main>
<section id="connexion">
  <p>Collez votre jeton GitHub. Il reste uniquement sur ce téléphone et sert à enregistrer vos modifications.</p>
  <label for="jeton">Jeton GitHub</label>
  <input id="jeton" type="password" autocomplete="off" placeholder="github_pat_...">
  <div class="actions"><button id="ok">Se connecter</button></div>
</section>

<section id="panneau" hidden>
  <nav><button data-t="articles" class="on">Articles</button><button data-t="apparence">Apparence</button></nav>

  <div id="t-articles">
    <div class="actions"><button id="ajouter">+ Ajouter un article</button></div>
    <div id="liste"></div>
    <div id="edition" class="fiche" hidden>
      <b id="edit-titre">Article</b>
      <label for="e-nom">Nom de l'article</label><input id="e-nom" type="text">
      <label for="e-prix">Prix en F CFA</label><input id="e-prix" type="number" inputmode="numeric" min="0">
      <label for="e-ancien">Ancien prix barré (facultatif)</label><input id="e-ancien" type="number" inputmode="numeric" min="0">
      <label for="e-photo">Photo (choisissez depuis votre galerie)</label><input id="e-photo" type="file" accept="image/*">
      <div class="actions"><button id="e-sauver">Enregistrer</button><button id="e-annuler" class="neutre">Annuler</button><button id="e-suppr" class="danger">Supprimer</button></div>
    </div>
  </div>

  <div id="t-apparence" hidden>
    <div class="fiche">
      <label for="a-titre">Titre d'accueil</label><input id="a-titre" type="text">
      <label for="a-sous">Texte de bienvenue</label><textarea id="a-sous" rows="3"></textarea>
      <label for="a-entete">Couleur de l'en-tête</label><input id="a-entete" type="color">
      <label for="a-fond">Couleur de fond du site</label><input id="a-fond" type="color">
      <label for="a-fond-img">Image de fond (facultatif)</label><input id="a-fond-img" type="file" accept="image/*">
      <label><input id="a-fond-off" type="checkbox"> Retirer l'image de fond</label>
      <label for="a-logo">Logo</label><input id="a-logo" type="file" accept="image/*">
      <div class="actions"><button id="a-sauver">Enregistrer l'apparence</button></div>
    </div>
  </div>
  <div class="actions"><button id="quitter" class="neutre">Se déconnecter</button></div>
</section>
<p id="msg" role="status"></p>
</main>

<script>
const OWNER = "DGS173", REPO = "solutiondecor", BRANCH = "main";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/";
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc = s => btoa(unescape(encodeURIComponent(s)));
const dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ""))));
const fmt = n => Number(n).toLocaleString("fr-FR").replace(/\u202f/g, " ") + " F CFA";
let token = "", produits = [], shaP = "", reglages = {}, shaR = "", courant = null;

function dire(t, ko){ const m = $("msg"); m.textContent = t; m.className = ko ? "ko" : "ok"; }
async function gh(path, opts){
  opts = opts || {};
  const url = API + path + (opts.method === "PUT" ? "" : "?ref=" + BRANCH + "&t=" + Date.now());
  const r = await fetch(url, Object.assign({}, opts, { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" } }));
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error("Jeton refusé. Vérifiez qu'il est correct et pas expiré.");
  if (r.status === 403 || r.status === 422) throw new Error("GitHub a refusé l'enregistrement. Le jeton doit avoir la permission « Contents : Read and write » sur le dépôt solutiondecor.");
  if (r.status === 409) throw new Error("Le fichier a changé entre-temps. Actualisez la page et recommencez.");
  if (!r.ok) throw new Error("Erreur GitHub " + r.status);
  return r.json();
}
async function lire(path){ const j = await gh(path); return j && { sha: j.sha, texte: dec(j.content) }; }
async function ecrire(path, b64, sha, message){
  const corps = { message: message, content: b64, branch: BRANCH };
  if (sha) corps.sha = sha;
  return gh(path, { method: "PUT", body: JSON.stringify(corps) });
}
function reduire(file, max, type){
  return new Promise((ok, ko) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d");
      if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL(type, 0.82).split(",")[1]);
    };
    img.onerror = () => ko(new Error("Image illisible."));
    img.src = u;
  });
}
const slug = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

async function charger(){
  const p = await lire("products.json");
  produits = p ? JSON.parse(p.texte) : []; shaP = p ? p.sha : "";
  const s = await lire("settings.json");
  reglages = s ? JSON.parse(s.texte) : {}; shaR = s ? s.sha : "";
  afficherListe(); remplirApparence();
}
function afficherListe(){
  $("liste").innerHTML = produits.map((p, i) =>
    '<div class="ligne"><img src="' + esc(p.image || "") + '" alt="" onerror="this.style.visibility=\'hidden\'"><div><b>' + esc(p.nom) + '</b><small>' + fmt(p.prix) + (p.ancien > p.prix ? ' (avant ' + fmt(p.ancien) + ')' : '') + '</small></div><button class="neutre" data-i="' + i + '">Modifier</button></div>'
  ).join("") || "<p>Aucun article.</p>";
}
function ouvrirEdition(i){
  courant = i === null ? null : produits[i];
  $("edit-titre").textContent = courant ? "Modifier l'article" : "Nouvel article";
  $("e-nom").value = courant ? courant.nom : "";
  $("e-prix").value = courant ? courant.prix : "";
  $("e-ancien").value = courant && courant.ancien > courant.prix ? courant.ancien : "";
  $("e-photo").value = "";
  $("e-suppr").hidden = !courant;
  $("edition").hidden = false;
  $("edition").scrollIntoView({ behavior: "smooth" });
}
async function sauverProduits(msg){
  const r = await ecrire("products.json", enc(JSON.stringify(produits, null, 1)), shaP, msg);
  shaP = r.content.sha;
}
async function enregistrerArticle(){
  const nom = $("e-nom").value.trim(), prix = parseInt($("e-prix").value, 10);
  const ancien = parseInt($("e-ancien").value, 10) || prix;
  if (!nom || !prix) { dire("Le nom et le prix sont obligatoires.", true); return; }
  $("e-sauver").disabled = true; dire("Enregistrement en cours…");
  try {
    const nouveau = !courant;
    const p = courant || { id: (slug(nom) || "article") + "-" + Date.now().toString(36).slice(-4) };
    p.nom = nom; p.prix = prix; p.ancien = ancien;
    const f = $("e-photo").files[0];
    if (f) {
      const chemin = "images/" + p.id + ".jpg";
      const ex = await gh(chemin);
      await ecrire(chemin, await reduire(f, 900, "image/jpeg"), ex && ex.sha, "Photo : " + nom);
      p.image = chemin + "?v=" + Date.now();
    } else if (!p.image) p.image = "images/" + p.id + ".jpg";
    if (nouveau) produits.unshift(p);
    await sauverProduits("Article : " + nom);
    $("edition").hidden = true; afficherListe();
    dire("Enregistré. Le site se met à jour dans environ une minute.");
  } catch (e) { dire(e.message, true); }
  $("e-sauver").disabled = false;
}
async function supprimerArticle(){
  if (!courant || !confirm("Supprimer « " + courant.nom + " » du site ?")) return;
  try {
    produits = produits.filter(p => p !== courant);
    await sauverProduits("Suppression : " + courant.nom);
    $("edition").hidden = true; afficherListe();
    dire("Article supprimé. Le site se met à jour dans environ une minute.");
  } catch (e) { dire(e.message, true); }
}
function remplirApparence(){
  $("a-titre").value = reglages.titre || "";
  $("a-sous").value = reglages.sousTitre || "";
  $("a-entete").value = reglages.enTete || "#14305a";
  $("a-fond").value = reglages.fondCouleur || "#f6f7f9";
}
async function enregistrerApparence(){
  $("a-sauver").disabled = true; dire("Enregistrement en cours…");
  try {
    reglages.titre = $("a-titre").value.trim();
    reglages.sousTitre = $("a-sous").value.trim();
    reglages.enTete = $("a-entete").value;
    reglages.fondCouleur = $("a-fond").value;
    const logo = $("a-logo").files[0], fond = $("a-fond-img").files[0];
    if (logo) {
      const ex = await gh("images/logo.png");
      await ecrire("images/logo.png", await reduire(logo, 400, "image/png"), ex && ex.sha, "Logo");
      reglages.logo = "images/logo.png?v=" + Date.now();
    }
    if (fond) {
      const ex = await gh("images/fond.jpg");
      await ecrire("images/fond.jpg", await reduire(fond, 1400, "image/jpeg"), ex && ex.sha, "Image de fond");
      reglages.fondImage = "images/fond.jpg?v=" + Date.now();
    }
    if ($("a-fond-off").checked) reglages.fondImage = "";
    const r = await ecrire("settings.json", enc(JSON.stringify(reglages, null, 1)), shaR, "Apparence");
    shaR = r.content.sha;
    dire("Apparence enregistrée. Le site se met à jour dans environ une minute.");
  } catch (e) { dire(e.message, true); }
  $("a-sauver").disabled = false;
}
async function entrer(t){
  token = t; dire("Connexion…");
  try {
    await charger();
    try { localStorage.setItem("dgs_jeton", t); } catch (e) {}
    $("connexion").hidden = true; $("panneau").hidden = false; dire("");
  } catch (e) { token = ""; dire(e.message, true); }
}
$("ok").addEventListener("click", () => { const t = $("jeton").value.trim(); if (t) entrer(t); });
$("quitter").addEventListener("click", () => { try { localStorage.removeItem("dgs_jeton"); } catch (e) {} location.reload(); });
$("ajouter").addEventListener("click", () => ouvrirEdition(null));
$("e-annuler").addEventListener("click", () => { $("edition").hidden = true; });
$("e-sauver").addEventListener("click", enregistrerArticle);
$("e-suppr").addEventListener("click", supprimerArticle);
$("a-sauver").addEventListener("click", enregistrerApparence);
$("liste").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) ouvrirEdition(+b.dataset.i); });
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  $("t-articles").hidden = b.dataset.t !== "articles"; $("t-apparence").hidden = b.dataset.t !== "apparence";
}));
try { const t = localStorage.getItem("dgs_jeton"); if (t) entrer(t); } catch (e) {}
</script>
</body>
</html>
