<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passer ma commande – DEOGRATIAS SOLUTION DÉCOR</title>
<style>
:root{--nuit:#14305a;--orange:#e8821a;--fond:#f6f7f9;--texte:#1c2433;--gris:#6b7486}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte)}
header{background:var(--nuit);color:#fff;padding:22px 18px}
header a{color:#c9d4e8;font-size:.95rem}
header h1{margin:12px 0 0;font-size:1.4rem}
form{max-width:560px;margin:auto;padding:20px 18px 40px}
label,legend{display:block;font-weight:700;margin:18px 0 6px;padding:0}
input[type=text],input[type=tel],input[type=email],input:not([type]),textarea{width:100%;padding:13px;border:1px solid #d5dae3;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:90px}
fieldset{border:0;padding:0;margin:0}
.choix{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #d5dae3;border-radius:10px;padding:12px;margin-top:8px;font-weight:600;cursor:pointer}
.choix small{display:block;font-weight:400;color:var(--gris);margin-top:2px}
.choix input{margin-top:4px;flex:none}
#recap{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:6px 14px}
.rl{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef1f6;line-height:1.35}
.rl small{display:block;color:var(--gris)}
.rt{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;padding:12px 0}
input:focus-visible,textarea:focus-visible,button:focus-visible,.wa:focus-visible,a:focus-visible{outline:3px solid var(--nuit);outline-offset:2px}
button,.wa{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:15px;font:inherit;font-weight:700;color:#fff;text-decoration:none;margin-top:18px;cursor:pointer}
button{background:var(--orange)}
button:disabled{opacity:.6}
.wa{background:#1f8f4e}
#msg{margin-top:16px;font-weight:600;line-height:1.45}
.ok{color:#1f7a45}.ko{color:#b3261e}
#code{display:none;margin-top:14px;background:#fff;border:2px dashed var(--orange);border-radius:12px;padding:14px;text-align:center}
#code b{display:block;font-size:1.5rem;letter-spacing:.06em;color:var(--nuit);margin-top:4px;user-select:all}
</style>
</head>
<body>
<header>
  <a href="index.html">← Retour à la boutique</a>
  <h1>Passer ma commande</h1>
</header>
<form id="form">
  <label>Ma commande</label>
  <div id="recap"></div>
  <p><a href="index.html">Modifier mon panier</a></p>

  <label for="nom">Nom complet</label>
  <input id="nom" name="nom" required autocomplete="name">
  <label for="telephone">Numéro de téléphone</label>
  <input id="telephone" name="telephone" type="tel" required autocomplete="tel" placeholder="+229 ...">
  <label for="email">Email (facultatif)</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="adresse">Adresse de livraison</label>
  <textarea id="adresse" name="adresse" required></textarea>

  <fieldset>
    <legend>Mode de paiement</legend>
    <div id="modes"></div>
  </fieldset>

  <button id="envoyer" type="submit">Envoyer ma commande</button>
  <a id="wa" class="wa" href="#" target="_blank" rel="noopener">Commander par WhatsApp</a>
  <div id="code" role="status">Votre numéro de commande, gardez-le et donnez-le-nous pour suivre votre commande :<b id="code-ref"></b></div>
  <p id="msg" role="status"></p>
</form>

<script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
<script>
const WHATSAPP = "22990637844";
const DEFAUT = {
  email: { publicKey: "", serviceId: "", templateId: "" },
  fedapay: { actif: true, publicKey: "pk_live_oKeXX1TaDms3pgEnXHrDCPAE" },
  p2: { actif: false, nom: "", lien: "" },
  p3: { actif: false, nom: "", lien: "" },
  commandesUrl: ""
};
let cfg = JSON.parse(JSON.stringify(DEFAUT));
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("fr-FR").replace(/\u202f/g, " ") + " F CFA";

/* Numéro de commande unique : 10 caractères tirés au hasard (plus de 800 000 milliards de combinaisons) */
function nouvelleRef(){
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", b = new Uint32Array(10);
  crypto.getRandomValues(b);
  let s = ""; b.forEach(v => { s += A[v % A.length]; });
  return "CMD-" + s.slice(0, 5) + "-" + s.slice(5);
}
const ref = nouvelleRef();

const f = $("form"), msg = $("msg"), bouton = $("envoyer");
const p = new URLSearchParams(location.search);
let lignes = [], noteWA = "", termine = false;
try { lignes = JSON.parse(localStorage.getItem("dgs_panier") || "[]"); } catch (e) {}
if (!lignes.length && p.get("article") && parseInt(p.get("prix"), 10) > 0) lignes = [{ id: "direct", nom: p.get("article"), prix: parseInt(p.get("prix"), 10), qte: 1 }];
const total = () => lignes.reduce((s, l) => s + l.prix * l.qte, 0);
const texteArticles = () => lignes.map(l => l.qte + " × " + l.nom + " = " + fmt(l.prix * l.qte)).join("\n");
const mode = () => (f.paiement && f.paiement.value) || "livraison";
const libelle = m => m === "livraison" ? "À la livraison" : m === "fedapay" ? "En ligne (FedaPay)" : (cfg[m] && cfg[m].nom) || "Autre paiement";
function dire(classe, texte){ msg.className = classe; msg.textContent = texte; }

function afficherRecap(){
  if (!lignes.length) { $("recap").innerHTML = '<p>Votre panier est vide. <a href="index.html">Choisir des articles</a></p>'; bouton.disabled = true; return; }
  $("recap").innerHTML = lignes.map(l => '<div class="rl"><span>' + esc(l.nom) + '<small>' + l.qte + ' × ' + fmt(l.prix) + '</small></span><b>' + fmt(l.prix * l.qte) + '</b></div>').join("") +
    '<div class="rt"><span>Total</span><span>' + fmt(total()) + '</span></div>';
  bouton.disabled = termine;
}
function construireModes(){
  const m = [{ v: "livraison", t: "Payer à la livraison", s: "Vous payez quand vous recevez les articles." }];
  if (cfg.fedapay.actif && cfg.fedapay.publicKey) m.push({ v: "fedapay", t: "Payer en ligne (Mobile Money, carte)", s: "Paiement sécurisé par FedaPay." });
  ["p2", "p3"].forEach(k => { if (cfg[k].actif && /^https:\/\//i.test(cfg[k].lien || "")) m.push({ v: k, t: cfg[k].nom || "Autre moyen de paiement", s: "Vous serez redirigé vers la page de paiement sécurisée." }); });
  $("modes").innerHTML = m.map((x, i) => '<label class="choix"><input type="radio" name="paiement" value="' + x.v + '"' + (i === 0 ? " checked" : "") + '><span>' + esc(x.t) + '<small>' + esc(x.s) + '</small></span></label>').join("");
  majBouton();
}
function majBouton(){ bouton.textContent = mode() === "livraison" ? "Envoyer ma commande" : "Continuer vers le paiement"; }
f.addEventListener("change", majBouton);

function texteWhatsApp(){
  return "Bonjour, je souhaite commander.\nNuméro de commande : " + ref + "\n" + texteArticles() + "\nTotal : " + fmt(total()) +
    "\nNom : " + f.nom.value + "\nTéléphone : " + f.telephone.value + "\nAdresse : " + f.adresse.value + "\nPaiement : " + libelle(mode()) + noteWA;
}
$("wa").addEventListener("click", () => { $("wa").href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(texteWhatsApp()); });

async function envoyerEmail(paiement){
  const e = cfg.email;
  const r = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ service_id: e.serviceId, template_id: e.templateId, user_id: e.publicKey,
      template_params: { reference: ref, article: texteArticles(), prix: fmt(total()), nom: f.nom.value, telephone: f.telephone.value,
        adresse: f.adresse.value, paiement: paiement, email_client: f.email.value } })
  });
  if (!r.ok) throw new Error(await r.text());
}
/* Enregistre la commande par email ET dans le carnet de commandes de l'admin (si configurés). Il suffit qu'un des deux marche. */
async function enregistrer(paiement, statut){
  const taches = [];
  const e = cfg.email;
  if (e.publicKey && e.serviceId && e.templateId) taches.push(envoyerEmail(paiement));
  if (/^https:\/\//i.test(cfg.commandesUrl || "")) taches.push(fetch(cfg.commandesUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ reference: ref, nom: f.nom.value, telephone: f.telephone.value, adresse: f.adresse.value, email: f.email.value,
      articles: texteArticles(), total: total(), paiement: paiement, statut: statut }) }));
  if (!taches.length) throw new Error("Aucun enregistrement configuré");
  const res = await Promise.allSettled(taches);
  if (!res.some(r => r.status === "fulfilled")) throw new Error("Échec de l'enregistrement");
}
function finir(texte){
  try { localStorage.removeItem("dgs_panier"); } catch (e) {}
  termine = true; bouton.disabled = true;
  $("code-ref").textContent = ref; $("code").style.display = "block";
  dire("ok", texte);
}

async function commanderALivraison(){
  dire("", "Envoi en cours…");
  try {
    await enregistrer("À la livraison", "Reçue");
    finir("Merci " + f.nom.value + ". Votre commande est bien reçue, nous vous appelons très vite pour confirmer la livraison.");
  } catch (err) {
    console.error(err);
    dire("ko", "L'envoi a échoué. Appuyez sur « Commander par WhatsApp » pour nous envoyer votre commande directement.");
    bouton.disabled = false;
  }
}
function payerFedaPay(){
  const client = { lastname: f.nom.value };
  if (f.email.value) client.email = f.email.value;
  FedaPay.init({
    public_key: cfg.fedapay.publicKey,
    transaction: { amount: total(), description: "Commande " + ref },
    currency: { iso: "XOF" },
    customer: client,
    onComplete: async function(resp){
      if (resp.reason === FedaPay.DIALOG_DISMISSED) {
        noteWA = "\nJ'ai payé en ligne via FedaPay, je vous envoie le SMS de confirmation.";
        $("code-ref").textContent = ref; $("code").style.display = "block";
        dire("ko", "Fenêtre fermée. Votre commande est enregistrée sous le numéro ci-dessus. Si vous avez déjà payé, appuyez sur « Commander par WhatsApp » et envoyez-nous le SMS de confirmation. Sinon, vous pouvez réessayer.");
        bouton.disabled = false; return;
      }
      const id = resp.transaction && resp.transaction.id ? " (transaction " + resp.transaction.id + ")" : "";
      try { await enregistrer("PAYÉ en ligne (FedaPay)" + id, "Payée"); } catch (e) { console.error(e); }
      finir("Merci " + f.nom.value + ". Votre paiement est reçu. Nous vous appelons très vite pour la livraison.");
    }
  }).open();
}
function payerParLien(k){
  const v = { montant: total(), article: encodeURIComponent(lignes.map(l => l.qte + "x " + l.nom).join(", ")), reference: ref, nom: encodeURIComponent(f.nom.value), telephone: encodeURIComponent(f.telephone.value) };
  const url = cfg[k].lien.replace(/\{(montant|article|reference|nom|telephone)\}/g, (_, c) => v[c]);
  if (!/^https:\/\//i.test(url)) { dire("ko", "Le lien de paiement est invalide. Utilisez WhatsApp pour commander."); bouton.disabled = false; return; }
  noteWA = "\nJ'ai payé via " + libelle(k) + ", numéro de commande " + ref + ".";
  $("code-ref").textContent = ref; $("code").style.display = "block";
  try { localStorage.removeItem("dgs_panier"); } catch (e) {}
  dire("ok", "Votre commande est enregistrée. Redirection vers la page de paiement…");
  setTimeout(() => { location.href = url; }, 1200);
}

f.addEventListener("submit", async e => {
  e.preventDefault();
  if (!lignes.length || termine) return;
  bouton.disabled = true; dire("", "");
  const m = mode();
  if (m === "livraison") return commanderALivraison();
  dire("", "Enregistrement de votre commande…");
  try { await enregistrer("EN ATTENTE : " + libelle(m) + ", à vérifier dans votre espace de paiement", "En attente de paiement"); }
  catch (err) {
    console.error(err);
    dire("ko", "Impossible d'enregistrer votre commande pour le moment. Appuyez sur « Commander par WhatsApp » pour nous l'envoyer directement.");
    bouton.disabled = false; return;
  }
  dire("", "");
  if (m === "fedapay") payerFedaPay(); else payerParLien(m);
});

const rS = fetch("settings.json?v=" + Date.now()).then(r => r.json()).then(s => {
  const pa = s.paiements || {};
  cfg.email = Object.assign({}, DEFAUT.email, s.email || {});
  cfg.fedapay = Object.assign({}, DEFAUT.fedapay, pa.fedapay || {});
  cfg.p2 = Object.assign({}, DEFAUT.p2, pa.p2 || {});
  cfg.p3 = Object.assign({}, DEFAUT.p3, pa.p3 || {});
  cfg.commandesUrl = s.commandesUrl || "";
}).catch(() => {});
/* Prix et noms toujours remis à jour depuis le catalogue */
const rP = fetch("products.json?v=" + Date.now()).then(r => r.json()).then(d => {
  lignes = lignes.filter(l => l.id === "direct" || d.some(x => x.id === l.id)).map(l => { const x = d.find(y => y.id === l.id); return x ? { id: l.id, nom: x.nom, prix: x.prix, qte: Math.max(1, Math.min(10, l.qte)) } : l; });
}).catch(() => {});
Promise.all([rS, rP]).then(() => { construireModes(); afficherRecap(); });
</script>
</body>
</html>
