<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passer ma commande – DEOGRATIAS SOLUTION DÉCOR</title>
<style>
:root{--nuit:#14305a;--orange:#e8821a;--fond:#f6f7f9;--texte:#1c2433;--gris:#6b7486}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte)}
header{background:var(--nuit);color:#fff;padding:22px 18px}
header a{color:#c9d4e8;font-size:.95rem}
header h1{margin:12px 0 0;font-size:1.4rem}
form{max-width:560px;margin:auto;padding:20px 18px 30px}
label,legend{display:block;font-weight:700;margin:18px 0 6px;padding:0}
input[type=text],input[type=tel],input[type=email],input:not([type]),textarea{width:100%;padding:13px;border:1px solid #d5dae3;border-radius:10px;font:inherit;background:#fff}
input[readonly]{background:#eef1f6}
textarea{min-height:90px}
fieldset{border:0;padding:0;margin:0}
.choix{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #d5dae3;border-radius:10px;padding:12px;margin-top:8px;font-weight:600;cursor:pointer}
.choix small{display:block;font-weight:400;color:var(--gris);margin-top:2px}
.choix input{margin-top:4px;flex:none}
input:focus-visible,textarea:focus-visible,button:focus-visible,.wa:focus-visible{outline:3px solid var(--nuit);outline-offset:2px}
button,.wa{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:15px;font:inherit;font-weight:700;color:#fff;text-decoration:none;margin-top:18px;cursor:pointer}
button{background:var(--orange)}
button:disabled{opacity:.6}
.wa{background:#1f8f4e}
#msg{margin-top:16px;font-weight:600;line-height:1.4}
.ok{color:#1f7a45}.ko{color:#b3261e}
</style>
</head>
<body>
<header>
  <a href="index.html">← Retour à la boutique</a>
  <h1>Passer ma commande</h1>
</header>
<form id="form">
  <label for="article">Article commandé</label>
  <input id="article" name="article" readonly>
  <label for="prix">Prix</label>
  <input id="prix" name="prix" readonly>
  <label for="nom">Nom complet</label>
  <input id="nom" name="nom" required autocomplete="name">
  <label for="telephone">Numéro de téléphone</label>
  <input id="telephone" name="telephone" type="tel" required autocomplete="tel" placeholder="+229 ...">
  <label for="email">Email (facultatif)</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="adresse">Adresse de livraison</label>
  <textarea id="adresse" name="adresse" required></textarea>

  <fieldset>
    <legend>Mode de paiement</legend>
    <label class="choix"><input type="radio" name="paiement" value="livraison" checked><span>Payer à la livraison<small>Vous payez quand vous recevez l'article.</small></span></label>
    <label class="choix"><input type="radio" name="paiement" value="en ligne"><span>Payer en ligne<small>Mobile Money ou carte bancaire, via FedaPay.</small></span></label>
  </fieldset>

  <button id="envoyer" type="submit">Envoyer ma commande</button>
  <a id="wa" class="wa" href="#" target="_blank" rel="noopener">Commander par WhatsApp</a>
  <p id="msg" role="status"></p>
</form>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>
<script>
/* === À REMPLIR / VÉRIFIER === */
const EMAILJS_PUBLIC_KEY = "COLLEZ_ICI_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "COLLEZ_ICI_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "COLLEZ_ICI_TEMPLATE_ID";
const FEDAPAY_PUBLIC_KEY = "pk_live_oKeXX1TaDms3pgEnXHrDCPAE"; // clé PUBLIQUE uniquement, jamais la clé sk_
const WHATSAPP = "22990637844";
/* ============================ */

const p = new URLSearchParams(location.search);
const montant = parseInt(p.get("prix"), 10) || 0;
const fmt = n => Number(n).toLocaleString("fr-FR").replace(/\u202f/g," ") + " F CFA";
const f = document.getElementById("form"), msg = document.getElementById("msg"), bouton = document.getElementById("envoyer");
f.article.value = p.get("article") || "";
f.prix.value = montant ? fmt(montant) : "";
const mode = () => f.paiement.value;
let noteWA = "";

function dire(classe, texte){ msg.className = classe; msg.textContent = texte; }
function texteWhatsApp(extra){
  return "Bonjour, je souhaite commander :\nArticle : " + f.article.value + "\nPrix : " + f.prix.value +
    "\nNom : " + f.nom.value + "\nTéléphone : " + f.telephone.value + "\nAdresse : " + f.adresse.value +
    "\nPaiement : " + (extra || mode()) + noteWA;
}
const wa = document.getElementById("wa");
wa.addEventListener("click", () => { wa.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(texteWhatsApp()); });
f.addEventListener("change", () => { bouton.textContent = mode() === "en ligne" ? "Payer en ligne" : "Envoyer ma commande"; });

const emailPret = !EMAILJS_PUBLIC_KEY.startsWith("COLLEZ");
if (emailPret) emailjs.init({publicKey: EMAILJS_PUBLIC_KEY});

async function envoyerEmail(paiement){
  if (!emailPret) throw new Error("EmailJS non configuré");
  await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    article: f.article.value, prix: f.prix.value, nom: f.nom.value,
    telephone: f.telephone.value, adresse: f.adresse.value, paiement: paiement
  });
}

async function commanderALivraison(){
  dire("", "Envoi en cours…");
  try {
    await envoyerEmail("À la livraison");
    dire("ok", "Merci " + f.nom.value + ". Votre commande est bien reçue, nous vous appelons très vite pour confirmer la livraison.");
    f.reset();
  } catch (err) {
    console.error(err);
    dire("ko", "L'envoi par email a échoué. Appuyez sur « Commander par WhatsApp » pour nous envoyer votre commande directement.");
  }
  bouton.disabled = false;
}

async function payerEnLigne(){
  if (!montant) { dire("ko", "Le prix de l'article est introuvable. Retournez à la boutique et choisissez l'article à nouveau."); bouton.disabled = false; return; }
  try { await envoyerEmail("EN ATTENTE : paiement en ligne lancé, à vérifier dans FedaPay"); } catch (e) { console.error(e); }
  const client = { lastname: f.nom.value };
  if (f.email.value) client.email = f.email.value;
  const widget = FedaPay.init({
    public_key: FEDAPAY_PUBLIC_KEY,
    transaction: { amount: montant, description: f.article.value },
    currency: { iso: "XOF" },
    customer: client,
    onComplete: async function(resp){
      if (resp.reason === FedaPay.DIALOG_DISMISSED) {
        noteWA = "\nJ'ai payé en ligne via FedaPay, je vous envoie le SMS de confirmation.";
        dire("ko", "Fenêtre fermée. Votre commande est enregistrée chez nous. Si vous avez déjà payé, appuyez sur « Commander par WhatsApp » et envoyez-nous le SMS de confirmation. Sinon, vous pouvez réessayer.");
        bouton.disabled = false; return;
      }
      const id = resp.transaction && resp.transaction.id ? " (transaction " + resp.transaction.id + ")" : "";
      try { await envoyerEmail("PAYÉ en ligne (FedaPay)" + id); } catch (e) { console.error(e); }
      dire("ok", "Merci " + f.nom.value + ". Votre paiement est reçu. Nous vous appelons très vite pour la livraison.");
      f.reset(); bouton.disabled = false;
    }
  });
  widget.open();
}

f.addEventListener("submit", e => {
  e.preventDefault();
  bouton.disabled = true; dire("", "");
  if (mode() === "en ligne") payerEnLigne(); else commanderALivraison();
});
</script>
</body>
</html>
